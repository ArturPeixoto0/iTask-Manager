<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>iTask Manager</title>

    <script src="app.js" defer></script>
    <link rel="stylesheet" href="style.css">
    
    <!-- Biblioteca momentJS que facilita a optenção do momento exato -->

</head>
<body>

    <div class="container">
        <h2>iTask-Manager</h2>

        <input type="text" id="tituloInput" placeholder="Digite o Título da tarefa">
        <input type="text" id="descricaoInput" placeholder="Digite o Descrição da tarefa">
        <button id="addBtn">Adicionar</button>

        <h3>Tarefas:</h3>
        <ul id="listaTarefas">
            <li></li>
        </ul>

        <!-- <button id="deletaBtn">Deletar</button>  -->

        <!-- Secção de Concluídas -->
         
       

        <h3>Concluídas:</h3>
        <ul id="listaConcluidas">
            <li></li>
        </ul>
        

        <button id="btnDelALL">APAGAR TUDO</button>
    </div>


    
</body>
</html>
